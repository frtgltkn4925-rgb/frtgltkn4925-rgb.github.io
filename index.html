 .oust{padding-top:calc(env(safe-area-inset-top) + 4px);padding-bottom:4px}

    const isci=async()=>{while(i<liste.length&&el.isConnected){const it=liste[i++],key=im+"/"+it.g;if(!(await SDB.al(key))){const b=await sesIndir(im,it.g);if(b){try{await SDB.koy(key,b)}catch(e){hata++}}else hata++}bitti++;indirB.textContent=`⬇ ${Math.round(bitti/liste.length*100)}%`}};
    await Promise.all([isci(),isci(),isci(),isci()]);indiriliyor=false;indirB.disabled=false;if(!el.isConnected)return;
    if(hata>=liste.length){indirB.textContent="⬇ İndir";bildir("Ses indirilemedi; internetten çalmaya devam eder.")}else{await indirDurum();bildir(hata?`İndirildi (${hata} ayet eksik)`:"Ses telefona indirildi; internetsiz de çalar.")}};

  // sesli komut
  const mikB=el.querySelector("#mik"),mikEt=el.querySelector("#mikEt");
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const komut=metin=>{const t=metin.toLocaleLowerCase("tr");
    if(/\b(dur|durdur|bekle|sus)\b/.test(t)){sesDur();kayDur();bilgi.textContent="Durduruldu (sesli komut)";return}
    if(/\b(devam|başla|oku|devam et)\b/.test(t)){if(sira>=0||caliyor)sesDevam();else kayBasla();bilgi.textContent="Devam ediliyor";return}
    if(/hızlan|hızlı|daha hızlı/.test(t)){hiz.value=Math.min(10,+hiz.value+1);hizYaz();return}
    if(/yavaşla|yavaş/.test(t)){hiz.value=Math.max(1,+hiz.value-1);hizYaz();return}
    if(/sonraki|geç/.test(t)&&liste.length){cal(sira+1)}};
  const mikKapat=()=>{mikAcik=false;mikB.classList.remove("on");mikEt.textContent="🎤 “dur” · “devam”";try{tanima&&tanima.stop()}catch(e){}};
  mikB.onclick=()=>{if(!SR){bildir("Bu tarayıcı sesli komutu desteklemiyor. Chrome ile açmayı deneyin.");return}
    if(mikAcik){mikKapat();return}
    mikAcik=true;mikB.classList.add("on");mikEt.innerHTML='<span class="mik"><i></i>Dinliyor…</span>';
    const basla=()=>{tanima=new SR();tanima.lang="tr-TR";tanima.continuous=true;tanima.interimResults=false;
      tanima.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)komut(e.results[i][0].transcript)};
      tanima.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"){mikKapat();bildir("Mikrofon izni verilmedi. Sayfayı Chrome'da açıp mikrofona izin verin.")}};
      tanima.onend=()=>{if(mikAcik)setTimeout(()=>{if(mikAcik)try{basla()}catch(e){}},250)};
      try{tanima.start()}catch(e){}};
    basla()};

  // kapat / okudum
  let yerKaydetDis=()=>{};
  const kapat=()=>{try{yerKaydetDis()}catch(e){}sesDur();kayDur();mikKapat();au.src="";sonraki.src="";el.remove();document.body.style.overflow=""};
  el.querySelector("#kapat").onclick=kapat;
  const ok=el.querySelector("#okudum");ok&&(ok.onclick=()=>{kapat();okudumIsaretle(k)});

  // metni yükle
  try{const ays=await cuzMetni(k);if(!el.isConnected)return;
    ays.forEach(x=>liste.push({s:x.s,n:x.n,g:x.g}));
    M.innerHTML=`<div class="ms">${mushafHTML(ays,k,true)}</div><div style="height:45vh"></div>`;indirDurum();
    const yerKey="ct.yer."+k;let yerT=0;
    const yerKaydet=g=>{const it=liste.find(x=>x.g===g);if(it)ls.set(yerKey,JSON.stringify({g,s:it.s,n:it.n}))};
    const ustAyet=()=>{const ust=M.getBoundingClientRect().top+40;for(const a of M.querySelectorAll(".ay")){if(a.getBoundingClientRect().bottom>ust)return +a.dataset.g}return 0};
    M.addEventListener("scroll",()=>{clearTimeout(yerT);yerT=setTimeout(()=>{const g=ustAyet();if(g)yerKaydet(g)},500)},{passive:true});
    yerKaydetDis=()=>{const g=caliyor&&sira>=0?liste[sira].g:ustAyet();if(g)yerKaydet(g)};
    try{const y=JSON.parse(ls.get(yerKey)||"null");const sp=y&&M.querySelector(`[data-g="${y.g}"]`);
      if(sp){M.scrollTop=Math.max(0,sp.getBoundingClientRect().top-M.getBoundingClientRect().top+M.scrollTop-60);sp.classList.add("su");setTimeout(()=>sp.classList.remove("su"),2500);
        bildir(`Kaldığın yerden devam: ${SURELER[y.s-1][0]} ${y.n}. ayet`,()=>{M.scrollTop=0;try{localStorage.removeItem(yerKey)}catch(e){}},"Baştan")}}catch(e){}
    let latin=ls.get("ct.lat")==="1";const latYaz=()=>{el.querySelector("#lat").classList.toggle("on",latin);M.querySelectorAll(".lat").forEach(x=>x.classList.toggle("hide",!latin));M.querySelectorAll(".ayetler").forEach(x=>x.classList.toggle("latinli",latin));ls.set("ct.lat",latin?"1":"0")};
    latYaz();el.querySelector("#lat").onclick=()=>{latin=!latin;latYaz()};
  }catch(e){M.innerHTML=`<p class="sol" style="text-align:center;margin-top:40px">Arapça metin yüklenemedi; internet bağlantısını kontrol edin.<br><br><a href="https://kuran.diyanet.gov.tr/mushaf" target="_blank" rel="noopener">Diyanet Kur'an Portalı'nda aç</a></p>`}
}

$("#internetsiz").onclick=async()=>{let dur=false;const kapat=altSayfa(`<h3>İnternetsiz okuma</h3><p class="sol">30 cüzün Arapça metni uygulamanın içine indiriliyor. Bittiğinde internet olmadan da her cüzü açabilirsin.</p><div style="background:var(--zum3);border-radius:10px;height:12px;overflow:hidden;margin:14px 0 8px"><i id="cb" style="display:block;height:100%;width:0;background:var(--zum);transition:width .2s"></i></div><p class="sol" id="cd">Başlıyor…</p><div class="secim"><button class="btn acik" id="dosya">Ayrı dosya olarak da indir</button><button class="btn acik" id="kp">Kapat</button></div>`,(sh,k)=>{sh.querySelector("#kp").onclick=()=>{dur=true;k()};sh.querySelector("#dosya").onclick=()=>{dur=true;k();internetsizIndir()}});
  const cb=document.querySelector("#cb"),cd=document.querySelector("#cd");let hata=0;
  for(let k=1;k<=30&&!dur;k++){cd.textContent=k+". cüz indiriliyor ("+k+"/30)";try{await cuzMetni(k)}catch(e){hata++}cb.style.width=(k/30*100)+"%"}
  if(!dur){cd.innerHTML=hata?"<b>"+(30-hata)+" cüz indirildi.</b> Eksikler için internete bağlıyken tekrar dene.":"<b>Hazır.</b> 30 cüzün hepsi bu telefonda; internetsiz okuyabilirsin.";ls.set("ct.internetsiz",hata?"":"1")}};
let kurIstegi=null;const kurulu=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();kurIstegi=e;$("#ekle").textContent="📲 Uygulamayı telefona kur"});
addEventListener("appinstalled",()=>{kurIstegi=null;$("#ekle").classList.add("hide");bildir("Cüz Takip telefona kuruldu")});
if(kurulu())$("#ekle").classList.add("hide");
$("#ekle").onclick=async()=>{if(kurIstegi){kurIstegi.prompt();const s=await kurIstegi.userChoice.catch(()=>null);kurIstegi=null;if(s&&s.outcome==="accepted")return}const ua=navigator.userAgent||"",ios=/iPhone|iPad|iPod/i.test(ua),and=/Android/i.test(ua);
  const iosA=`<b>iPhone / iPad (Safari)</b><ol class="sol" style="padding-left:18px;margin:6px 0 12px"><li>Bu sayfayı <b>Safari</b>'de aç (WhatsApp'ın içinden değil).</li><li>Alttaki <b>Paylaş</b> simgesine (□↑) dokun.</li><li>Aşağı kaydır → <b>Ana Ekrana Ekle</b>.</li><li>Adı “Cüz Takip” bırak → <b>Ekle</b>.</li></ol>`;
  const andA=`<b>Android (Chrome)</b><ol class="sol" style="padding-left:18px;margin:6px 0 12px"><li>Bu sayfayı <b>Chrome</b>'da aç (WhatsApp'ın içinden değil).</li><li>Sağ üstteki <b>⋮</b> menüsüne dokun.</li><li><b>Uygulamayı yükle</b> (ya da <b>Ana ekrana ekle</b>) → <b>Yükle</b>.</li><li>“Cüz Takip” simgesi ana ekranda görünür.</li></ol>`;
  const pcA=`<b>Bilgisayar (Chrome)</b><ol class="sol" style="padding-left:18px;margin:6px 0 12px"><li>Sağ üstteki <b>⋮</b> menüsüne tıkla.</li><li><b>Yayınla, kaydet ve paylaş</b> → <b>Kısayol oluştur…</b></li><li><b>Pencere olarak aç</b> kutusunu işaretle → <b>Oluştur</b>.</li></ol>`;
  altSayfa(`<h3>Uygulama olarak ekle</h3><p class="sol">Bir kez kurarsın; sonra <b>Cüz Takip</b> simgesine dokununca uygulama gibi tam ekran açılır, bildirim alır ve indirdiğin cüzler internetsiz açılır.</p>${ios?iosA+andA:and?andA+iosA:pcA+andA+iosA}<p class="sol">iPhone'da bildirim alabilmek için uygulamayı ana ekrana eklemek şarttır (iOS 16.4 ve üstü).</p><button class="btn tam" id="tm">Tamam</button>`,(sh,k)=>{sh.querySelector("#tm").onclick=k})};
/* ===== Servis çalışanı ve bildirimler ===== */
let swKayit=null;
if("serviceWorker" in navigator)navigator.serviceWorker.register("firebase-messaging-sw.js").then(r=>{swKayit=r}).catch(e=>console.warn("SW",e));
const fbHazir=()=>!!(AYAR.FIREBASE&&AYAR.FIREBASE.apiKey&&AYAR.VAPID_ANAHTARI);
function bildirimDurumu(){if(!("Notification" in window))return "yok";if(Notification.permission==="granted"&&ls.get("ct.tk."+KOD))return "acik";return Notification.permission}
function betikYukle(u){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${u}"]`))return res();const s=document.createElement("script");s.src=u;s.onload=res;s.onerror=()=>rej(new Error("Bildirim kütüphanesi yüklenemedi"));document.head.appendChild(s)})}
let mesajlasma=null;
async function fbMesaj(){if(mesajlasma)return mesajlasma;await betikYukle("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js");await betikYukle("https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js");
  if(!firebase.apps.length)firebase.initializeApp(AYAR.FIREBASE);mesajlasma=firebase.messaging();
  mesajlasma.onMessage(p=>{const n=p.notification||p.data||{};bildir((n.title?n.title+" · ":"")+(n.body||""));yenile()});return mesajlasma}
async function bildirimAc(sessiz){
  const ios=/iPhone|iPad|iPod/i.test(navigator.userAgent||"");
  if(!KOD){if(!sessiz)bildir("Önce yöneticinin gönderdiği kişisel linki açın.");return}
  if(ios&&!kurulu()){if(!sessiz)altSayfa(`<h3>Önce ana ekrana ekle</h3><p class="sol">iPhone'da bildirimler yalnızca ana ekrana eklenmiş uygulamada çalışır.</p><ol class="sol" style="padding-left:18px"><li>Safari'de alttaki <b>Paylaş</b> (□↑) simgesine dokun.</li><li><b>Ana Ekrana Ekle</b> → <b>Ekle</b>.</li><li>Ana ekrandaki <b>Cüz Takip</b>'i aç ve <b>Bildirimleri aç</b>'a bas.</li></ol><button class="btn tam" id="tm">Tamam</button>`,(sh,k)=>{sh.querySelector("#tm").onclick=k});return}
  if(!("Notification" in window)||!("serviceWorker" in navigator)){if(!sessiz)bildir("Bu tarayıcı bildirim desteklemiyor. Chrome ile açın.");return}
  if(!fbHazir()){if(!sessiz)bildir("Bildirim ayarı henüz yapılmamış (yönetici config.js'i doldurmalı).");return}
  try{const izin=sessiz?Notification.permission:await Notification.requestPermission();
    if(izin!=="granted"){if(!sessiz)bildir(izin==="denied"?"Bildirim izni kapalı. Telefon ayarlarından Cüz Takip için bildirimlere izin verin.":"Bildirim izni verilmedi.");return}
    const reg=swKayit||await navigator.serviceWorker.ready;const m=await fbMesaj();
    const tk=await m.getToken({vapidKey:AYAR.VAPID_ANAHTARI,serviceWorkerRegistration:reg});if(!tk)throw new Error("Bildirim anahtarı alınamadı");
    const eski=ls.get("ct.tk."+KOD);if(eski!==tk||!sessiz){await sunucu("bildirimKaydet",KOD,tk);ls.set("ct.tk."+KOD,tk)}
    if(!sessiz){await sunucu("denemeBildirimi",KOD).catch(()=>{});bildir("Bildirimler açık. Deneme bildirimi gönderildi.");ciz()}
  }catch(e){if(!sessiz)bildir("Bildirim açılamadı: "+(e.message||e))}}
// izin daha önce verildiyse anahtarı sessizce tazele
if(KOD&&fbHazir()&&"Notification" in window&&Notification.permission==="granted")setTimeout(()=>bildirimAc(true),3000);
ciz();yenile();
setInterval(()=>{if(!document.hidden&&!mesgul)yenile()},15000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)yenile()});
</script>
